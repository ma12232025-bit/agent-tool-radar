<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Agent 工具雷达 · GitHub 高星 Skill / 插件 / MCP 发现器</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0e1116; --panel:#141924; --card:#171c26; --line:#242c3a;
  --text:#e7ecf3; --muted:#8b96a8; --accent:#5eead4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;font-size:14px}
.wrap{max-width:1150px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#121826,#0e1116)}
.header-inner{padding:20px 20px 16px}
h1{margin:0;font-size:22px;letter-spacing:.5px}
.sub{color:var(--muted);font-size:13px;margin:6px 0 0}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:4px 12px;font-size:12px;color:var(--muted)}
.chip b{color:var(--text);font-weight:600}
.head-actions{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);
  border-radius:10px;padding:8px 16px;font-size:13px}
.btn:hover{border-color:#3b4a63}
.btn.primary{background:linear-gradient(90deg,#0d9488,#4f46e5);border:none;color:#fff;font-weight:600;padding:9px 22px}
.btn.primary:disabled{opacity:.55;cursor:wait}
.btn.small{padding:5px 12px;font-size:12px}
.search-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0}
textarea{width:100%;min-height:84px;background:#0d1017;color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:12px;font-size:14px;resize:vertical;font-family:inherit;line-height:1.6}
textarea:focus{outline:none;border-color:#3b82f6}
.search-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px;flex-wrap:wrap}
.chk{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}
.hint{color:var(--accent);font-size:13px;margin-top:10px;min-height:18px}
.browse-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:999px;padding:6px 16px;font-size:13px}
.tab.active{background:#1d2939;border-color:#33415580;color:#fff;font-weight:600}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.filters select,.filters input{background:#0d1017;color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:13px}
.filters input{width:200px}
.mode-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:#12202b;border:1px solid #1d4152;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.hidden{display:none!important}
#results{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){#results{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card .head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card a{color:#93c5fd;font-weight:600;text-decoration:none;font-size:15px;word-break:break-all}
.card a:hover{text-decoration:underline}
.stars{color:#fbbf24;font-weight:700;white-space:nowrap}
.desc{color:#c3cbd8;font-size:13px;line-height:1.55;margin:0}
.intro{font-size:13px;line-height:1.65;color:#b9c7dc;background:#101623;border:1px solid #223047;border-radius:8px;padding:8px 11px}
.intro-tag{display:inline-block;font-size:11px;font-weight:600;color:#5eead4;background:#0c2a26;border-radius:5px;padding:0 7px;margin-right:7px}
.matched{font-size:12px;color:var(--muted)}
.matched code{background:#0d1017;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:5px;color:#5eead4}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600}
.badge.mcp{background:#3b1d6e;color:#ddd6fe}
.badge.skill{background:#0c4a34;color:#a7f3d0}
.badge.plugin{background:#71310f;color:#fed7aa}
.badge.other{background:#1f2937;color:#cbd5e1}
.fresh{color:#5eead4;font-weight:600}
.topics{display:flex;gap:6px;flex-wrap:wrap}
.topics span{background:#10141d;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;color:#7dd3fc}
.empty{color:var(--muted);text-align:center;padding:60px 0;grid-column:1/-1;line-height:2}
.more-row{text-align:center;margin:18px 0 8px}
footer{color:var(--muted);font-size:12px;padding:26px 20px 44px;line-height:1.8}
</style>
</head>
<body>
<header>
  <div class="wrap header-inner">
    <div class="head-actions">
      <div>
        <h1>🛰️ Agent 工具雷达</h1>
        <p class="sub">定时扫描 GitHub · 发现高星的 Agent Skill / 插件 / MCP 服务器 · 用中文描述需求即可查找</p>
      </div>
      <button id="btnFetch" class="btn">⟳ 立即扫描</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="wrap">
  <section class="search-card">
    <textarea id="q" placeholder="用中文描述你的需求，例如：&#10;· 我想让 AI 自动读取 PDF 发票并汇总到 Excel&#10;· 需要一个能操作浏览器自动填表的 MCP 工具&#10;· 找一些能写技术文档、画架构图的 skill"></textarea>
    <div class="search-row">
      <label class="chk"><input type="checkbox" id="live" checked> 同时到 GitHub 实时搜索最新项目</label>
      <button id="btnSearch" class="btn primary">🔍 开始查找</button>
    </div>
    <div class="hint" id="hint"></div>
  </section>

  <section class="browse-bar" id="browseBar">
    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="all">全部</button>
      <button class="tab" data-cat="mcp">MCP 服务器</button>
      <button class="tab" data-cat="skill">Skills</button>
      <button class="tab" data-cat="plugin">插件</button>
    </div>
    <div class="filters">
      <label>最低星数
        <select id="minStars">
          <option value="0">不限</option>
          <option value="100">100+</option>
          <option value="500" selected>500+</option>
          <option value="1000">1000+</option>
          <option value="5000">5000+</option>
        </select>
      </label>
      <input id="browseQ" placeholder="站内过滤，如 pdf / browser / 飞书">
    </div>
  </section>

  <section class="mode-bar hidden" id="modeBar">
    <span id="modeText"></span>
    <button id="btnBack" class="btn small">← 返回浏览全部</button>
  </section>

  <section id="results"></section>
  <div class="more-row"><button id="btnMore" class="btn hidden">加载更多</button></div>
</main>

<footer class="wrap">
  Agent 工具雷达 · 数据来自 GitHub Search API，仅作发现与导航用途，安装/使用请遵循各项目自身的许可与安全说明。<br>
  定时扫描在软件运行期间自动进行；也可用 install_task.bat 创建 Windows 计划任务，在软件未运行时每日更新数据。
</footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,"") + "k" : String(n||0);
const CAT_LABEL = {mcp:"MCP", skill:"Skill", plugin:"插件", other:"工具"};

const state = {mode:"browse", cat:"all", minStars:500, q:"", offset:0, total:0, loading:false};

async function getJSON(url){
  const r = await fetch(url);
  return r.json();
}

function renderStats(s){
  $("#stats").innerHTML = `
    <span class="chip">已收录 <b>${s.total}</b> 个仓库</span>
    <span class="chip">MCP <b>${s.categories.mcp}</b></span>
    <span class="chip">Skill <b>${s.categories.skill}</b></span>
    <span class="chip">插件 <b>${s.categories.plugin}</b></span>
    <span class="chip">上次扫描 <b>${s.meta.last_fetched || "尚未扫描"}</b></span>
    <span class="chip">下次扫描 <b>${s.next_fetch_human}</b></span>
    <span class="chip">${s.llm_enabled ? "LLM 智能增强：已开启" : "LLM 智能增强：未配置（当前为内置词典匹配）"}</span>`;
}

function card(r){
  const cats = (r.categories||[]).map(c=>`<span class="badge ${c}">${CAT_LABEL[c]||c}</span>`).join("");
  const matched = (r.matched&&r.matched.length)
    ? `<div class="matched">匹配：${r.matched.map(m=>`<code>${esc(m)}</code>`).join("")}</div>` : "";
  const topics = (r.topics&&r.topics.length)
    ? `<div class="topics">${r.topics.slice(0,8).map(t=>`<span>#${esc(t)}</span>`).join("")}</div>` : "";
  const intro = r.intro
    ? `<div class="intro"><span class="intro-tag">AI 介绍</span>${esc(r.intro)}</div>` : "";
  return `<div class="card">
    <div class="head">
      <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.full_name)}</a>
      <span class="stars">★ ${fmt(r.stars)}</span>
    </div>
    <p class="desc">${esc(r.description||"（无描述）")}</p>
    ${intro}${matched}${topics}
    <div class="meta">${cats}
      ${r.language?`<span>${esc(r.language)}</span>`:""}
      ${r.pushed_at?`<span>更新 ${esc(r.pushed_at)}</span>`:""}
      ${r.fresh?`<span class="fresh">⚡ 实时新发现</span>`:""}
      ${r.score!==undefined?`<span>相关度 ${r.score}</span>`:""}
    </div>
  </div>`;
}

function setHint(t){ $("#hint").textContent = t||""; }

async function loadBrowse(append){
  state.loading = true;
  $("#btnMore").classList.add("hidden");
  if(!append) $("#results").innerHTML = `<div class="empty">加载中…</div>`;
  const p = new URLSearchParams({category:state.cat, min_stars:state.minStars,
    q:state.q, offset:state.offset, limit:30});
  const d = await getJSON("/api/repos?"+p);
  state.total = d.total;
  $("#browseBar").classList.remove("hidden");
  $("#modeBar").classList.add("hidden");
  if(!d.repos.length && !append){
    $("#results").innerHTML = `<div class="empty">暂无数据。<br>点击右上角「⟳ 立即扫描」从 GitHub 抓取高星工具（约 2 分钟）。</div>`;
  } else {
    $("#results").innerHTML = (append ? $("#results").innerHTML : "") + d.repos.map(card).join("");
    $("#btnMore").classList.toggle("hidden", state.offset + d.repos.length >= state.total);
  }
  state.loading = false;
}

async function doSearch(){
  const q = $("#q").value.trim();
  if(!q){ setHint("请先用中文描述你的需求"); return; }
  $("#btnSearch").disabled = true;
  setHint("正在分析需求并匹配…（若包含 GitHub 实时搜索约需 5–20 秒）");
  $("#results").innerHTML = `<div class="empty">🔍 匹配中…</div>`;
  try{
    const p = new URLSearchParams({q, live: $("#live").checked ? 1 : 0});
    const d = await getJSON("/api/search?"+p);
    if(d.error){ setHint(d.error); loadBrowse(); return; }
    state.mode = "search";
    $("#browseBar").classList.add("hidden");
    $("#modeBar").classList.remove("hidden");
    $("#modeText").textContent =
      `智能搜索 “${q}”：${d.total} 个结果` +
      (d.fresh_added ? ` · ⚡ 实时发现 ${d.fresh_added} 个新项目` : "") +
      (d.llm_used ? " · LLM 增强匹配" : " · 内置词典匹配");
    if(d.note) setHint(d.note); else setHint("");
    $("#results").innerHTML = d.results.length
      ? d.results.map(card).join("")
      : `<div class="empty">没有匹配结果。换个说法，或增加更多关键词试试。</div>`;
  }catch(e){
    setHint("搜索失败："+e);
    loadBrowse();
  }finally{
    $("#btnSearch").disabled = false;
  }
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  state.cat = t.dataset.cat; state.mode = "browse"; state.offset = 0;
  loadBrowse();
});
$("#minStars").onchange = e => { state.minStars = e.target.value; state.mode="browse"; state.offset=0; loadBrowse(); };
let qTimer = null;
$("#browseQ").oninput = e => { clearTimeout(qTimer); qTimer = setTimeout(()=>{
  state.q = e.target.value.trim(); state.mode="browse"; state.offset=0; loadBrowse(); }, 350); };
$("#btnSearch").onclick = doSearch;
$("#q").addEventListener("keydown", e => { if((e.ctrlKey||e.metaKey) && e.key==="Enter") doSearch(); });
$("#btnBack").onclick = () => { state.mode="browse"; state.offset=0; setHint(""); loadBrowse(); };
$("#btnMore").onclick = () => { state.offset += 30; loadBrowse(true); };

let pollTimer = null;
$("#btnFetch").onclick = async () => {
  $("#btnFetch").disabled = true; $("#btnFetch").textContent = "扫描中…";
  setHint("已触发 GitHub 扫描，约需 1–2 分钟…");
  await fetch("/api/fetch", {method:"POST"});
  pollTimer = setInterval(async () => {
    const s = await getJSON("/api/stats");
    renderStats(s);
    if(!s.fetch_running){
      clearInterval(pollTimer); pollTimer = null;
      $("#btnFetch").disabled = false; $("#btnFetch").textContent = "⟳ 立即扫描";
      setHint(s.fetch_message || "扫描完成");
      if(state.mode==="browse") loadBrowse();
    }
  }, 2500);
};

(async function init(){
  try{
    const s = await getJSON("/api/stats");
    renderStats(s);
    if(s.fetch_running){ $("#btnFetch").disabled = true; $("#btnFetch").textContent = "扫描中…";
      pollTimer = setInterval(async()=>{ const x = await getJSON("/api/stats"); renderStats(x);
        if(!x.fetch_running){ clearInterval(pollTimer); $("#btnFetch").disabled=false; $("#btnFetch").textContent="⟳ 立即扫描"; renderStats(x);} },2500); }
  }catch(e){}
  loadBrowse();
})();
</script>
</body>
</html>
