name: 每日自动扫描 GitHub

on:
  schedule:
    # GitHub 定时任务在高负载时可能延迟甚至跳过当次运行，
    # 因此每天安排两个时间点互为备份（数据无变化时自动跳过提交）：
    - cron: "35 2 * * *"    # UTC 02:35 ≈ 北京时间 10:35
    - cron: "45 13 * * *"   # UTC 13:45 ≈ 北京时间 21:45
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 扫描 GitHub（抓取高星 Skill / 插件 / MCP）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetcher.py --once

      - name: 为新仓库生成中文介绍（可选：需在 Secrets 配置 DEEPSEEK_API_KEY）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python gen_intros.py --limit 50

      - name: 生成网页版数据
        run: python build_web.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repos.json docs/data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date -u +%Y-%m-%d)"
            git push
          fi
