name: 每日自动扫描 GitHub

on:
  schedule:
    # UTC 01:30 = 北京时间 09:30（Actions 定时可能有几分钟延迟）
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 扫描 GitHub（抓取高星 Skill / 插件 / MCP）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetcher.py --once

      - name: 生成网页版数据
        run: python build_web.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repos.json docs/data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date -u +%Y-%m-%d)"
            git push
          fi
